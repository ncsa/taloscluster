[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taloscluster-rancher"
version = "0.1.0"
description = "taloscluster plugin: register a cluster with Rancher and reconcile its members"
requires-python = ">=3.10"
# PyYAML comes in via taloscluster; requests is used directly by the Rancher client
dependencies = [
    "taloscluster",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "types-requests"]

# how taloscluster finds this plugin; the value is the module that re-exports the
# plugin protocol (configured/converge/destroy/status/check + AFTER)
[project.entry-points."taloscluster.plugins"]
rancher = "taloscluster_rancher"

# taloscluster is the workspace root; resolve it from the checkout, not PyPI
[tool.uv.sources]
taloscluster = { workspace = true }

[tool.setuptools.packages.find]
include = ["taloscluster_rancher*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
