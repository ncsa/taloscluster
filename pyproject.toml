[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterctl"
version = "0.1.0"
description = "Converge a Talos Kubernetes cluster on OpenStack from cluster.yaml (Python alternative to the terraform/ + bin/cluster.sh workflow)"
requires-python = ">=3.10"
dependencies = [
    "openstacksdk>=3.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# the `openstack` CLI is NOT needed by clusterctl, but handy for poking at the
# cloud by hand. install with: uv sync --extra openstack   (or uv run --extra openstack openstack ...)
openstack = ["python-openstackclient"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "types-requests"]

[project.scripts]
clusterctl = "clusterctl.cli:main"

[tool.setuptools.packages.find]
include = ["clusterctl*"]

# talosctl and kubectl are required at runtime but are external binaries, not
# python packages -- clusterctl shells out to them (see clusterctl/errors.py
# preflight). openstack CLI / yq / jq / curl / xz are intentionally NOT needed.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # openstacksdk ships no stubs
warn_unused_ignores = true
