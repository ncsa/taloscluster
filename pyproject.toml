[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taloscluster"
version = "0.8.0"
description = "Converge and manage a Talos Kubernetes cluster on OpenStack or Proxmox, optionally alongside bare metal, from a declarative cluster.yaml"
requires-python = ">=3.10"
dependencies = [
    "openstacksdk>=3.0",
    "keystoneauth1>=5.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
# the `openstack` CLI is NOT needed by taloscluster, but handy for poking at the
# cloud by hand. install with: uv sync --extra openstack   (or uv run --extra openstack openstack ...)
openstack = ["python-openstackclient"]
# optional plugins (plugins/*), hooked into converge/plan/destroy/status/check
# through the `taloscluster.plugins` entry point:
#   uv tool install "taloscluster[argocd,charts,rancher] @ git+https://github.com/ncsa/taloscluster"
argocd = ["taloscluster-argocd"]
charts = ["taloscluster-charts"]
rancher = ["taloscluster-rancher"]
all = ["taloscluster-argocd", "taloscluster-charts", "taloscluster-rancher"]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "taloscluster-argocd",
    "taloscluster-charts",
    "taloscluster-rancher",
    "mkdocs-material>=9.7.7",
    "mkdocs>=1.6.1,<2",
    "pytest-timeout>=2.4",
    "pytest-cov>=7",
]

# plugins live in this repo; a new one is a new folder under plugins/ and is
# picked up by the glob, no edit here.
[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
taloscluster-argocd = { workspace = true }
taloscluster-charts = { workspace = true }
taloscluster-rancher = { workspace = true }

[project.scripts]
taloscluster = "taloscluster.cli:main"

[tool.setuptools.packages.find]
include = ["taloscluster*"]

# talosctl and kubectl are required at runtime but are external binaries, not
# python packages -- taloscluster shells out to them (see taloscluster/errors.py
# preflight). openstack CLI / yq / jq / curl / xz are intentionally NOT needed.

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
timeout = 30

[tool.coverage.run]
source = ["taloscluster", "plugins/argocd/taloscluster_argocd", "plugins/charts/taloscluster_charts", "plugins/rancher/taloscluster_rancher"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["openstack"]

[tool.mypy]
python_version = "3.10"
# the shipped packages: tests/ carries fixtures mypy was never run against
files = ["taloscluster", "plugins"]
ignore_missing_imports = true   # openstacksdk ships no stubs
warn_unused_ignores = true
